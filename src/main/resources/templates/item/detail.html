<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${item.title} + ' - 校园二手闲置交易平台'">商品详情</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="site-body">

<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}"><span class="brand-logo">二</span><span class="brand-text">校园二手</span></a>
        <form class="search-box" th:action="@{/item/search}" method="get">
            <input type="text" name="keyword" placeholder="搜索闲置物品">
            <button type="submit">搜索</button>
        </form>
        <nav class="site-nav">
            <a th:href="@{/item/list}">逛闲置</a>
            <a th:if="${loginUser != null}" th:href="@{/item/publish}">发布闲置</a>
            <a th:if="${loginUser == null}" class="nav-btn" th:href="@{/login}">登录</a>
            <a th:if="${loginUser != null}" th:href="@{/profile}">个人中心</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
    <div class="flash flash-error" th:if="${error}" th:text="${error}"></div>
</div>

<main class="container site-main">

    <div class="card">
        <div class="detail-wrap">
            <!-- 左：图片 -->
            <div>
                <div class="detail-cover-wrap"><img id="mainCover" class="detail-cover"
                     th:src="${item.cover != null} ? ${item.cover} : @{/images/placeholder.png}" alt="商品主图">
                </div>
                <div class="thumb-row" th:if="${images != null and !#lists.isEmpty(images)}">
                    <img th:each="img : ${images}" th:src="${img.url}" th:attr="data-src=${img.url}"
                         th:onclick="'switchCover(this.dataset.src)'" alt="小图">
                </div>
            </div>

            <!-- 右：信息 -->
            <div>
                <h1 class="detail-title" th:text="${item.title}">商品标题</h1>
                <div class="detail-price" th:text="'¥' + ${item.price}">¥0</div>

                <ul class="info-list">
                    <li>分类：<span th:text="${item.categoryName}">-</span></li>
                    <li>卖家：<span th:text="${item.sellerName}">-</span></li>
                    <li>发布：<span th:text="${#temporals.format(item.createTime, 'yyyy-MM-dd HH:mm')}">-</span></li>
                    <li>状态：
                        <span class="tag" th:if="${item.onSale}" th:text="${item.dealStatusName}"></span>
                        <span class="tag tag-gray" th:unless="${item.onSale}" th:text="${item.dealStatusName}"></span>
                        <span class="tag tag-gray" th:if="${item.auditStatus != 1}" th:text="${item.auditStatusName}"></span>
                    </li>
                </ul>

                <h3>物品描述</h3>
                <p th:text="${item.description}">描述</p>

                <div class="detail-actions">
                    <th:block th:if="${loginUser == null}">
                        <a class="btn btn-primary" th:href="@{/login}">登录后购买</a>
                    </th:block>

                    <th:block th:if="${loginUser != null and !isOwner and item.onSale}">
                        <form th:action="@{/order/create}" method="post" class="inline-form">
                            <input type="hidden" name="itemId" th:value="${item.id}">
                            <button class="btn btn-primary" type="submit">立即购买</button>
                        </form>
                        <form th:action="@{/item/{id}/cart(id=${item.id})}" method="post" class="inline-form">
                            <button class="btn btn-plain" type="submit">加入想要清单</button>
                        </form>
                    </th:block>

                    <th:block th:if="${loginUser != null and isOwner}">
                        <a class="btn btn-plain" th:href="@{/seller/items}">管理我的商品</a>
                    </th:block>

                    <th:block th:if="${loginUser != null and !isOwner and !item.onSale}">
                        <span class="tag tag-red">该物品暂不可购买</span>
                    </th:block>
                </div>
            </div>
        </div>
    </div>

    <!-- 留言区 -->
    <div class="card">
        <h3 class="card-title">留言咨询（<span th:text="${#lists.size(comments)}">0</span>）</h3>

        <form th:if="${loginUser != null}" th:action="@{/item/{id}/comment(id=${item.id})}" method="post">
            <div class="form-row">
                <textarea name="content" placeholder="询问成色、交易地点等..." maxlength="500" required></textarea>
            </div>
            <button class="btn btn-primary btn-sm" type="submit">发表留言</button>
        </form>
        <p class="muted" th:if="${loginUser == null}"><a th:href="@{/login}">登录</a>后可以留言咨询</p>

        <div class="comment" th:each="cm : ${comments}">
            <div class="comment-head">
                <span th:text="${cm.fromUserName}">买家</span>
                <span th:text="${#temporals.format(cm.createTime, 'yyyy-MM-dd HH:mm')}">时间</span>
            </div>
            <p th:text="${cm.content}">留言内容</p>
            <div class="comment-reply" th:if="${cm.replyContent != null}">
                <strong>卖家回复：</strong><span th:text="${cm.replyContent}"></span>
            </div>
        </div>
        <div class="empty" th:if="${comments == null or #lists.isEmpty(comments)}">还没有留言，来问第一个问题吧</div>
    </div>

    <!-- 相关推荐 -->
    <div class="section-title" th:if="${related != null and !#lists.isEmpty(related)}"><h2>猜你喜欢</h2></div>
    <div class="item-grid">
        <a class="item-card" th:each="r : ${related}" th:href="@{/item/detail/{id}(id=${r.id})}">
            <img class="item-cover" th:src="${r.cover != null} ? ${r.cover} : @{/images/placeholder.png}" alt="推荐">
            <div class="item-body">
                <div class="item-title" th:text="${r.title}">推荐</div>
                <div class="item-meta"><span class="price" th:text="'¥' + ${r.price}">¥0</span></div>
            </div>
        </a>
    </div>

</main>

<footer class="site-footer"><div class="container">校园二手闲置交易平台</div></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
