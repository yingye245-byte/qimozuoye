<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品列表 - 校园二手闲置交易平台</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="site-body">

<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}"><span class="brand-logo">二</span><span class="brand-text">校园二手</span></a>
        <form class="search-box" th:action="@{/item/search}" method="get">
            <input type="text" name="keyword" th:value="${query.keyword}" placeholder="搜索闲置物品">
            <button type="submit">搜索</button>
        </form>
        <nav class="site-nav">
            <a th:href="@{/item/list}">逛闲置</a>
            <a th:if="${loginUser != null}" th:href="@{/item/publish}">发布闲置</a>
            <a th:if="${loginUser == null}" class="nav-btn" th:href="@{/login}">登录</a>
            <a th:if="${loginUser != null}" th:href="@{/profile}">个人中心</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
    <div class="flash flash-error" th:if="${error}" th:text="${error}"></div>
</div>

<main class="container site-main">

    <!-- 筛选条件 -->
    <form class="filter-bar" th:action="@{/item/list}" method="get">
        <label>分类
            <select name="categoryId">
                <option value="">全部</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${query.categoryId != null and query.categoryId == c.id}"></option>
            </select>
        </label>
        <label>关键词
            <input type="text" name="keyword" th:value="${query.keyword}" placeholder="商品名称">
        </label>
        <label>价格
            <input type="number" name="minPrice" th:value="${query.minPrice}" placeholder="最低" style="width: 90px;">
            -
            <input type="number" name="maxPrice" th:value="${query.maxPrice}" placeholder="最高" style="width: 90px;">
        </label>
        <label>排序
            <select name="sort">
                <option value="new" th:selected="${query.sort == 'new'}">最新发布</option>
                <option value="priceAsc" th:selected="${query.sort == 'priceAsc'}">价格从低到高</option>
                <option value="priceDesc" th:selected="${query.sort == 'priceDesc'}">价格从高到低</option>
                <option value="hot" th:selected="${query.sort == 'hot'}">留言最多</option>
            </select>
        </label>
        <button class="btn btn-primary btn-sm" type="submit">筛选</button>
        <a class="btn btn-plain btn-sm" th:href="@{/item/list}">重置</a>
        <span class="muted" th:text="'共 ' + ${page.total} + ' 件物品'"></span>
    </form>

    <!-- 商品列表 -->
    <div class="item-grid">
        <a class="item-card" th:each="it : ${page.records}" th:href="@{/item/detail/{id}(id=${it.id})}">
            <div class="item-cover-wrap"><img class="item-cover" th:src="${it.cover != null} ? ${it.cover} : @{/images/placeholder.png}" alt="商品图"></div>
            <div class="item-body">
                <div class="item-title" th:text="${it.title}">商品标题</div>
                <div class="item-meta">
                    <span class="price" th:text="'¥' + ${it.price}">¥0</span>
                    <span class="tag" th:text="${it.categoryName}">分类</span>
                </div>
                <div class="item-meta">
                    <span class="muted" th:text="${it.sellerName}">卖家</span>
                    <span class="muted" th:text="'留言 ' + (${it.commentCount} != null ? ${it.commentCount} : 0)">留言 0</span>
                </div>
            </div>
        </a>
    </div>
    <div class="empty" th:if="${page.records == null or #lists.isEmpty(page.records)}">没有找到符合条件的物品，换个筛选条件试试</div>

    <!-- 分页 -->
    <div class="pager" th:if="${page.pages > 1}">
        <a th:href="@{/item/list(page=${page.current - 1}, categoryId=${query.categoryId}, keyword=${query.keyword}, minPrice=${query.minPrice}, maxPrice=${query.maxPrice}, sort=${query.sort})}"
           th:if="${page.current > 1}">上一页</a>
        <span th:text="${page.current} + ' / ' + ${page.pages}"></span>
        <a th:href="@{/item/list(page=${page.current + 1}, categoryId=${query.categoryId}, keyword=${query.keyword}, minPrice=${query.minPrice}, maxPrice=${query.maxPrice}, sort=${query.sort})}"
           th:if="${page.current < page.pages}">下一页</a>
    </div>

</main>

<footer class="site-footer"><div class="container">校园二手闲置交易平台</div></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
