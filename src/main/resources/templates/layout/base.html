<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手闲置交易平台</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<!-- 抽出来的公共抽屉布局：业务页面用 th:replace="~{layout/base :: page(~{::content})}" 套用 -->
<body th:fragment="page(content)" class="site-body">

<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-logo">二</span>
            <span class="brand-text">校园二手</span>
        </a>

        <form class="search-box" th:action="@{/item/search}" method="get">
            <input type="text" name="keyword" placeholder="搜索你想要的闲置物品，如：自行车、高数教材">
            <button type="submit">搜索</button>
        </form>

        <nav class="site-nav">
            <a th:href="@{/item/list}">逛闲置</a>
            <a th:if="${loginUser != null}" th:href="@{/item/publish}">发布闲置</a>

            <th:block th:if="${loginUser == null}">
                <a class="nav-btn" th:href="@{/login}">登录</a>
                <a class="nav-btn nav-btn-primary" th:href="@{/register}">注册</a>
            </th:block>

            <th:block th:if="${loginUser != null}">
                <a th:href="@{/profile/cart}">想要清单</a>
                <a th:href="@{/order/buyer}">我的订单</a>
                <a th:if="${loginUser.role >= 2}" th:href="@{/seller}">卖家中心</a>
                <a th:if="${loginUser.role == 3}" th:href="@{/admin}">后台管理</a>
                <div class="user-chip">
                    <img th:if="${loginUser.avatar != null}"
                         th:src="${loginUser.avatar}" alt="头像" class="avatar">
                    <span th:text="${loginUser.nickname}">用户</span>
                </div>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="link-btn">退出</button>
                </form>
            </th:block>
        </nav>
    </div>
</header>

<div class="container">
    <div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
    <div class="flash flash-error" th:if="${error}" th:text="${error}"></div>
</div>

<main class="container site-main">
    <div th:replace="${content}"></div>
</main>

<footer class="site-footer">
    <div class="container">
        <p>校园二手闲置交易平台 · Spring Boot 企业级项目开发期末综合大作业</p>
        <p class="muted">技术栈：Spring Boot 2.7+ / Thymeleaf / MyBatis-Plus / MySQL 8.0 / Redis / RabbitMQ / Spring Security</p>
    </div>
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
