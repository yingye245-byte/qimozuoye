<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的商品 - 校园二手闲置交易平台</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="site-body">

<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}"><span class="brand-logo">二</span><span class="brand-text">校园二手</span></a>
        <nav class="site-nav">
            <a th:href="@{/item/list}">逛闲置</a>
            <a th:href="@{/seller}">卖家中心</a>
            <a th:href="@{/seller/items}">我的商品</a>
            <a th:href="@{/seller/comments}">留言管理</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
    <div class="flash flash-error" th:if="${error}" th:text="${error}"></div>
</div>

<main class="container site-main">
    <div class="card">
        <h2 class="card-title">我的商品</h2>

        <div class="filter-bar">
            <a class="btn btn-plain btn-sm" th:href="@{/seller/items}">全部</a>
            <a class="btn btn-plain btn-sm" th:href="@{/seller/items(auditStatus=0)}">待审核</a>
            <a class="btn btn-plain btn-sm" th:href="@{/seller/items(auditStatus=1)}">已通过</a>
            <a class="btn btn-plain btn-sm" th:href="@{/seller/items(auditStatus=2)}">已驳回</a>
            <a class="btn btn-primary btn-sm" th:href="@{/item/publish}" style="margin-left:auto;">发布闲置</a>
        </div>

        <table class="data" th:if="${items != null and !#lists.isEmpty(items)}">
            <thead>
            <tr>
                <th>商品</th>
                <th>分类</th>
                <th>价格</th>
                <th>审核</th>
                <th>状态</th>
                <th>成交</th>
                <th>发布时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="it : ${items}">
                <td>
                    <a th:href="@{/item/detail/{id}(id=${it.id})}" th:text="${it.title}">商品</a>
                </td>
                <td th:text="${it.categoryName}">分类</td>
                <td class="price" th:text="'¥' + ${it.price}">¥0</td>
                <td>
                    <span class="tag tag-gray" th:if="${it.auditStatus == 0}">待审核</span>
                    <span class="tag" th:if="${it.auditStatus == 1}">已通过</span>
                    <span class="tag tag-red" th:if="${it.auditStatus == 2}">已驳回</span>
                </td>
                <td th:text="${it.statusName}">在售</td>
                <td th:text="${it.dealStatusName}">未成交</td>
                <td th:text="${it.createTime != null} ? ${#temporals.format(it.createTime, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td>
                    <form th:if="${it.status == 1 and it.dealStatus == 1}" th:action="@{/item/toggle/{id}(id=${it.id})}"
                          method="post" class="inline-form">
                        <button class="btn btn-plain btn-sm" type="submit">下架</button>
                    </form>
                    <form th:if="${it.status == 2 and it.dealStatus == 1}" th:action="@{/item/toggle/{id}(id=${it.id})}"
                          method="post" class="inline-form">
                        <button class="btn btn-primary btn-sm" type="submit">重新上架</button>
                    </form>
                    <form th:if="${it.dealStatus == 1}" th:action="@{/item/delete/{id}(id=${it.id})}"
                          method="post" class="inline-form" onsubmit="return confirm('确定删除该商品吗？');">
                        <button class="btn btn-danger btn-sm" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${items == null or #lists.isEmpty(items)}">还没有商品，去发布一个吧</div>
    </div>
</main>

<footer class="site-footer"><div class="container">校园二手闲置交易平台</div></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
