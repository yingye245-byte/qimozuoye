<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 校园二手闲置交易平台</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="site-body">

<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}"><span class="brand-logo">二</span><span class="brand-text">校园二手</span></a>
        <nav class="site-nav">
            <a th:href="@{/}">返回首页</a>
            <a class="nav-btn nav-btn-primary" th:href="@{/register}">免费注册</a>
        </nav>
    </div>
</header>

<main class="container site-main" style="max-width: 460px;">
    <div class="card">
        <h2 class="card-title">登录</h2>

        <div class="flash flash-success" th:if="${param.logout}">已安全退出</div>
        <div class="flash flash-success" th:if="${param.expired}">账号已在别处登录，你已被下线</div>
        <div class="flash flash-error" th:if="${param.error}">用户名或密码错误，或账号被禁用</div>
        <div class="flash flash-success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-row">
                <label for="username">用户名</label>
                <input id="username" type="text" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-row">
                <label for="password">密码</label>
                <input id="password" type="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-row">
                <label style="font-weight: 400;">
                    <input type="checkbox" name="remember-me"> 记住我（7 天）
                </label>
            </div>
            <button class="btn btn-primary" type="submit" style="width: 100%;">登录</button>
        </form>

        <p class="muted" style="margin-top: 16px;">
            还没有账号？<a th:href="@{/register}">立即注册</a>
        </p>
        <p class="muted">演示账号：user01 / seller01 / admin，初始密码均为 123456</p>
    </div>
</main>

<footer class="site-footer"><div class="container">校园二手闲置交易平台</div></footer>
</body>
</html>
